name: Test, Build and Publish Windows Alpha

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python files
        run: python -m compileall -q mccp.py tests
      - name: Test runtime and API
        run: python -m unittest discover -s tests -v

  windows:
    name: Package Windows portable exe
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install PyInstaller
        run: python -m pip install --upgrade "pyinstaller>=6.10,<7"
      - name: Package MCCP into a standalone executable
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name MCCP mccp.py
      - name: Verify Windows executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/MCCP.exe")) { throw "Windows executable missing" }
          $exe = Get-Item "dist/MCCP.exe"
          if ($exe.Length -lt 5000000) { throw "Executable appears incomplete" }
          Write-Host "MCCP.exe size: $($exe.Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: MCCP-Windows-portable
          path: dist/MCCP.exe
          if-no-files-found: error
      - name: Publish a downloadable rolling alpha release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete alpha-latest --yes --cleanup-tag 2>$null
          gh release create alpha-latest "dist/MCCP.exe" --target "$env:GITHUB_SHA" --prerelease --latest=false --title "MCCP Alpha (rolling build)" --notes "Automated Windows portable executable built from commit $env:GITHUB_SHA. Local brain and GUI included. Early alpha: Minecraft bridge not yet released. Run MCCP.exe; the brain daemon launches automatically."
